name: CI

on:
  push:
    # Branches only: a tag push runs the same checks in release.yml.
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      # `wxt zip` builds first, so no separate build step is needed.
      - run: npm run zip
      - run: npm run zip:firefox

      - uses: actions/upload-artifact@v7
        with:
          name: karadial-zips
          path: .output/*.zip
          # `.output` is a hidden directory, which upload-artifact skips by default.
          include-hidden-files: true
          if-no-files-found: error
