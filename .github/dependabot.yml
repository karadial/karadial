version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # typescript-eslint and svelte-check do not support TypeScript 7 yet.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # The types have to match the Node version in .node-version.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
